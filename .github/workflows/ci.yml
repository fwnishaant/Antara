name: ANTARA CI — Build, Lint & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  build-and-lint:
    name: Install, Type-Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type-check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Build application (DEMO MODE)
        run: npm run build
        env:
          DEMO_MODE: 'true'
          AI_MODE: 'demo'
          RAZORPAY_KEY_ID: 'rzp_test_ci_demo_key'
          RAZORPAY_KEY_SECRET: 'ci_secret_placeholder'
          RAZORPAY_WEBHOOK_SECRET: 'ci_webhook_placeholder'
          NEXT_PUBLIC_RAZORPAY_KEY_ID: 'rzp_test_ci_demo_key'
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
