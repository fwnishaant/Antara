version: '3.8'

services:
  antara:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antara-app
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DEMO_MODE=${DEMO_MODE:-true}
      - AI_MODE=${AI_MODE:-demo}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_antara_demo_key}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-antara_secret_demo_12345}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-antara_webhook_secret_98765}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_antara_demo_key}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
